[project]
name = "titanic-survival-predictor"
version = "0.1.0"
description = "Pipeline ML end-to-end: predicción de supervivencia en el Titanic — Proyecto Final Módulo 1 ITAM"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.3,<2.0",
    "torch>=2.2.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0",
    "pandera>=0.21.0",
    "mlflow>=2.9.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.5",
    "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────
# ruff — linter + formatter
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (imports sin usar, variables indefinidas)
    "I",    # isort (ordenar imports)
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernizar syntax)
    "B",    # flake8-bugbear (bugs potenciales)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # líneas largas — controlado por line-length
    "B008",   # llamadas a funciones en argumentos por defecto (común en ML)
    "E402",   # imports no al inicio — necesario en scripts con sys.path.insert
    "N803",   # argumento X en mayúscula — convención estándar en ML (X, y)
    "N806",   # variable X en función — convención estándar en ML (X_train, etc.)
]

[tool.ruff.lint.isort]
known-first-party = ["titanic_survival"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
